server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/crop-health/ {
        proxy_pass https://crop.kindwise.com/api/v1/;
        proxy_ssl_server_name on;
        proxy_ssl_name crop.kindwise.com;
        proxy_set_header Host crop.kindwise.com;
        proxy_set_header Api-Key ${CROP_HEALTH_API_KEY};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
